services:
  backend:
    build:
      context: ./stockman_backend
      dockerfile: Dockerfile
    ports:
      - "1234:80"
    volumes:
      - backend-db:/var/www/html/storage/db
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/storage/db/database.sqlite
    restart: unless-stopped

  frontend:
    build:
      context: ./stockman_frontend
      dockerfile: Dockerfile
    ports:
      - "8765:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-db:
