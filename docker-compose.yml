services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stockman
      POSTGRES_USER: stockman
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockman -d stockman"]
      interval: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./stockman_backend
      dockerfile: Dockerfile
    ports:
      - "1234:80"
    volumes:
      - backend-db:/var/www/html/storage/db
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: stockman
      DB_USERNAME: stockman
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./stockman_frontend
      dockerfile: Dockerfile
    ports:
      - "8765:80"
    environment:
      BACKEND_HOST: "${BACKEND_HOST:-backend}"
      BACKEND_PORT: "${BACKEND_PORT:-80}"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-db:
  pgdata:
